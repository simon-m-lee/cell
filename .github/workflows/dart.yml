name: dart

on:
  pull_request:
    paths:
      - '.github/workflows/dart.yml'
      - 'packages/cell/**'
      - 'packages/cell_flow/**'
      - 'packages/cell_tissue/**'
      - 'packages/cell_flutter_devtools/**'
  push:
    branches: [master]
    paths:
      - '.github/workflows/dart.yml'
      - 'packages/cell/**'
      - 'packages/cell_flow/**'
      - 'packages/cell_tissue/**'
      - 'packages/cell_flutter_devtools/**'

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [cell, cell_flow, cell_tissue, cell_flutter_devtools]
    steps:
      - uses: actions/checkout@v5
      - name: Setup Dart (pure-Dart packages)
        if: matrix.package != 'cell_flutter_devtools'
        uses: dart-lang/setup-dart@v1
        with:
          # Matches the Dart bundled with cell_flutter.yml's Flutter 3.41.9;
          # the doc-chooser generator output is SDK-sensitive, so this pin
          # keeps the freshness tests aligned with the checked-in files.
          sdk: '3.11.5'
      - name: Setup Flutter (cell_flutter_devtools — its example/ is a Flutter app)
        if: matrix.package == 'cell_flutter_devtools'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: dart pub get
        working-directory: packages/${{ matrix.package }}
        run: dart pub get
      - name: dart analyze (lib + test)
        working-directory: packages/${{ matrix.package }}
        run: dart analyze lib test

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package: [cell, cell_flow, cell_tissue, cell_flutter_devtools]
    steps:
      - uses: actions/checkout@v5
      - name: Setup Dart (pure-Dart packages)
        if: matrix.package != 'cell_flutter_devtools'
        uses: dart-lang/setup-dart@v1
        with:
          # Matches the Dart bundled with cell_flutter.yml's Flutter 3.41.9.
          sdk: '3.11.5'
      - name: Setup Flutter (cell_flutter_devtools — its example/ is a Flutter app)
        if: matrix.package == 'cell_flutter_devtools'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: dart pub get
        working-directory: packages/${{ matrix.package }}
        run: dart pub get
      - name: dart test
        working-directory: packages/${{ matrix.package }}
        run: dart test
