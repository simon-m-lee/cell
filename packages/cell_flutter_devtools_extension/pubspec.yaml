name: cell_flutter_devtools_extension
description: DevTools extension web app for cell_flutter_devtools — the ledger timeline UI.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cell: ^2.0.0
  devtools_extensions: ^0.5.0
  devtools_app_shared: ^0.5.0
  vm_service: ^15.0.0
  cell_flutter_devtools:
    path: ../cell_flutter_devtools

dependency_overrides:
  cell:
    path: ../cell

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
