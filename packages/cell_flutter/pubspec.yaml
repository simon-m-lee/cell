name: cell_flutter
description: Flutter widget bindings for Mitosis cells — reactive builders, selectors, listeners, error boundaries, hooks, and a complete widget-testing surface.
version: 1.1.0
homepage: https://github.com/simon-m-lee/cell
repository: https://github.com/simon-m-lee/cell/tree/master/packages/cell_flutter
issue_tracker: https://github.com/simon-m-lee/cell/issues
documentation: https://github.com/simon-m-lee/cell/tree/master/packages/cell_flutter#readme
topics:
  - flutter
  - reactive
  - state-management
  - cell
  - mitosis
environment:
  # cell 2.0.0 requires Dart >= 3.5.0; Flutter 3.24 is the first stable
  # Flutter release that ships Dart 3.5, so the binding's floor is 3.24.
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'
dependencies:
  flutter:
    sdk: flutter
  # `testing.dart` imports flutter_test from lib/, so the test framework
  # must be resolvable by consumers who import that entry point — hence a
  # regular dependency. (The old comment compared this to bloc_test /
  # mocktail / mockito; those packages depend on `test` / `test_api`, not
  # flutter_test, so the comparison was wrong. Extracting the testing
  # surface into a `cell_flutter_test` package is the cleaner design and
  # is scheduled for 2.0; the API freeze keeps this layout for 1.x.)
  flutter_test:
    sdk: flutter
  # Published floor: cell 2.0.0 (the Causal Replay release). The replay
  # round-trip API (required `journal:` parameters, commit 05b4895d) and
  # the retained-pulse accessor `Cell.latestPulse` (which `retainedPulseOf`
  # relies on for late-subscriber seeding) both shipped in that release.
  cell: ^2.0.0
  # Required at resolution time (lib/hooks.dart imports it); optional at
  # import time — only `package:cell_flutter/hooks.dart` users see it.
  # Wide floor keeps 0.20.x consumers working while supporting the latest
  # 0.21.x release (pub.dev "up-to-date dependencies" scoring).
  flutter_hooks: '>=0.20.5 <0.22.0'
dev_dependencies:
  flutter_lints: ^4.0.0
  test: ^1.30.0
  # Migration-guide fixtures: the "before" halves of the fixture
  # pairs are written in these packages; they are test-only.
  provider: ^6.1.5
  flutter_riverpod: ^3.0.0
  flutter_bloc: ^9.0.0
flutter:
  uses-material-design: false
platforms:
  android:
  ios:
  linux:
  macos:
  windows:
  web:

# Local workspace resolution only. pub ignores dependency_overrides for
# dependents, so published consumers always resolve the `cell: ^2.0.0`
# floor above; local development and CI build against the sibling
# checkout. (The core `cell` package itself uses `resolution: workspace`
# for the same purpose; this package predates the workspace and keeps the
# explicit override for now — see tool/release-publish.sh.)
dependency_overrides:
  cell:
    path: ../cell
