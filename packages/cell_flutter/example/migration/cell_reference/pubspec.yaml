name: cell_reference
description: Cell reference screen for the migration guide — the same todo feature on cell_flutter, with txApply.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cell: ^2.0.0
  cell_flutter: ^1.0.0

dependency_overrides:
  cell:
    path: ../../../../cell
  cell_flutter:
    path: ../../..

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
