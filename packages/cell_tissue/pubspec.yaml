name: cell_tissue
description: >-
  Application Layer (Tissue) for the Cell Framework — Reactive collections 
  (List, Set, Map, Queue) with granular signaling and forensic traceability.
version: 1.0.0-rc.5

homepage: https://github.com/simon-m-lee/cell
repository: https://github.com/simon-m-lee/cell/tree/master/packages/cell_tissue
issue_tracker: https://github.com/simon-m-lee/cell/issues
documentation: https://github.com/simon-m-lee/cell/tree/master/packages/cell_tissue#readme

topics:
  - reactive
  - collections
  - state-management
  - forensic-traceability
  - observable

# Use 'none' to prevent accidental publishing until the RC cycle is complete
#publish_to: none

resolution: workspace

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  cell: ^1.0.0-rc.4

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
  cell_flow: ^1.0.0-rc.4

platforms:
  android:
  ios:
  linux:
  macos:
  windows:
  web: