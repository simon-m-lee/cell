name: cell_flow
description: >-
  Orchestration Layer (Flow) for the Cell Framework — 90+ forensic-grade 
  operators (asyncMap, switchMap, debounce) for reactive signal processing.
version: 1.0.0-rc.3

homepage: https://github.com/simon-m-lee/cell
repository: https://github.com/simon-m-lee/cell/tree/master/packages/cell_flow
issue_tracker: https://github.com/simon-m-lee/cell/issues
documentation: https://github.com/simon-m-lee/cell/tree/master/packages/cell_flow#readme

topics:
  - reactive
  - streams
  - forensic-traceability
  - state-management
  - async-orchestration

# Use 'none' to prevent accidental publishing until the RC cycle is complete
publish_to: none

resolution: workspace

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  cell: ^1.0.0-rc.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

platforms:
  android:
  ios:
  linux:
  macos:
  windows:
  web: