name: cell_flow
description: >
  Cell Flow (codename Mitosis): Rx-shaped operators for the Cell framework.
  Debounce, switchMap, zip, retry and friends as FlowInstructions on package:cell.
version: 1.0.0-rc.1
homepage: https://github.com/simon-m-lee/cell/tree/master/packages/cell_flow
repository: https://github.com/simon-m-lee/cell
issue_tracker: https://github.com/simon-m-lee/cell/issues
documentation: https://github.com/simon-m-lee/cell/tree/master/packages/cell_flow
topics:
  - reactive
  - streams
  - rx
  - state-management
  - cells

environment:
  sdk: ^3.3.0

# pub.dev does not allow path / git dependencies in published packages.
# Keep this version in lockstep with package:cell (Mitosis RC).
dependencies:
  cell: 1.0.0-rc.1

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0

# Optional: local monorepo work before cell is on pub.dev.
# Delete this block (or the whole file section) before `dart pub publish`.
# dependency_overrides:
#   cell:
#     path: ../cell