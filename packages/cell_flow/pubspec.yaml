name: cell_flow
description: >
  Cell Flow (codename Mitosis): Rx-shaped operators for the Cell framework.
  Debounce, switchMap, zip, retry and friends as FlowInstructions on package:cell.
version: 1.0.0-rc.2.0.1
homepage: https://github.com/simon-m-lee/cell/tree/master/packages/cell_flow
repository: https://github.com/simon-m-lee/cell
issue_tracker: https://github.com/simon-m-lee/cell/issues
documentation: https://github.com/simon-m-lee/cell/tree/master/packages/cell_flow

resolution: workspace

topics:
  - reactive
  - streams
  - rx
  - state-management
  - cells

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  cell: ^1.0.0-rc.2

#dependency_overrides:
#  cell:
#    path: ../cell

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

