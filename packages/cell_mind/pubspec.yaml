name: cell_mind
description: >-
  Cognitive policy for the Cell framework — Context-aware decisions at
  runtime, decision log with replay, Context accumulation via offline
  reinforcement learning, and prompted policy for LLM verdicts.
version: 1.1.0

homepage: https://github.com/simon-m-lee/cell
repository: https://github.com/simon-m-lee/cell/tree/master/packages/cell_mind
issue_tracker: https://github.com/simon-m-lee/cell/issues
documentation: https://github.com/simon-m-lee/cell/tree/master/packages/cell_mind#readme

resolution: workspace

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  cell: ^1.1.0
  cell_tissue: ^1.0.0
  crypto: ^3.0.0

dev_dependencies:
  benchmark_harness: ^2.3.0
  cell_organ:
    path: ../cell_organ
  lints: ^6.0.0
  test: ^1.25.0

topics:
  - ai
  - governance
  - reactive
  - policy
  - reinforcement-learning

platforms:
  android:
  ios:
  linux:
  macos:
  windows:
  web:
