name: cell_memory_live_demo
description: >-
  Kiosk Twins: a two-kiosk Flutter demo where cell_memory_firebase is the
  boundary layer for the Mitosis stack (Cell + Flow + Tissue + Skin over a
  Mock MCP). Not published.
publish_to: none
version: 0.1.0

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cell: ^2.1.0
  cell_flow: ^1.2.0
  cell_tissue: ^1.2.0
  cell_skin: ^0.1.0
  cell_flutter: ^1.1.0
  cell_memory: ^1.0.0
  cell_memory_firebase: ^1.0.0
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  firebase_auth: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
