name: cell_flutter_router
description: "go_router bridge for cell_flutter: route state as a reactive cell."
version: 0.1.1
homepage: https://github.com/simon-m-lee/cell
environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cell: ^2.0.0
  cell_flutter: ^1.0.0
  go_router: ">=14.0.0 <19.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_hooks: ^0.20.5
  test: ^1.30.0

dependency_overrides:
  cell_flutter:
    path: ../cell_flutter
  cell:
    path: ../cell
