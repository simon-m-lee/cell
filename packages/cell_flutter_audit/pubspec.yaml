name: cell_flutter_audit
description: "Audit trail widgets for cell_flutter: render ApplyReceipt ledgers as a filterable, exportable timeline."
version: 0.1.1
homepage: https://github.com/simon-m-lee/cell
environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cell: ^2.0.0
  cell_flutter: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  cell_flutter:
    path: ../cell_flutter
  cell:
    path: ../cell

topics:
  - audit
  - reactive
  - state-management
  - widgets
