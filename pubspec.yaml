name: mitosis
description: >-
  Umbrella package for the Mitosis reactive framework — Cell (core),
  Flow (orchestration), and Tissue (application) layers for Dart.
version: 3.1.0

homepage: https://github.com/simon-m-lee/cell
repository: https://github.com/simon-m-lee/cell
issue_tracker: https://github.com/simon-m-lee/cell/issues
documentation: https://github.com/simon-m-lee/cell#readme

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  cell: ^2.1.0
  cell_flow: ^1.2.0
  cell_tissue: ^1.2.0

dev_dependencies:
  test: ^1.25.0

  fake_async: ^1.3.3


topics:
  - reactive
  - state-management
  - streams
  - collections
  - framework

platforms:
  android:
  ios:
  linux:
  macos:
  windows:
  web:

workspace:
  - packages/cell
  - packages/cell_flow
  - packages/cell_tissue
  # cell_organ and cell_mind are repository-private (kept out of version
  # control) and therefore cannot be workspace members — a fresh checkout
  # has no such directories, and pub refuses to resolve the workspace.
  # They resolve the local sources through their own path
  # dependency_overrides instead.
